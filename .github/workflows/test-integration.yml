name: Integration Tests

on:
  pull_request:
    branches: [ main ]
    types: [ ready_for_review, synchronize ]

jobs:
  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          
      - name: Run Integration Tests
        run: go test -v -race -run Integration ./...
